<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Berty Shop - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="left-section">
            <img src="assets/images/berty.png" alt="Berty Shop" class="shop-image">
        </div>
        <div class="right-section">
            <h1 class="welcome-text">SELAMAT DATANG </h1>
            <form id="loginForm">
                <input type="text" id="username" placeholder="username" class="input-field" required>
                <input type="password" id="password" placeholder="password" class="input-field" required>
                <button type="submit" class="login-btn">LOGIN</button>
            </form>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
